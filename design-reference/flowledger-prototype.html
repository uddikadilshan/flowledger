const pad=n=>String(n).padStart(2,'0');

const balance=(b,cut)=>b.opening+sum(b.entries.filter(e=>e.date<=cut).map(e=>e.amount))-sum(b.payments.filter(p=>p.date<=cut).map(p=>p.amount));

function seed(){let prev=monthShift(currentMonth,-2),date=day=>monthDate(currentMonth,day);let b={id:uid(),name:'Bloom & Co.',description:'Lifestyle studio & retail',email:'hello@example.com',phone:'',address:'',logo:'',opening:15000,days:[1,2,3,4,5,6],members:[],expenses:[{id:'rent',name:'Studio rent',category:'Rent',amount:45000,due:monthDate(prev,25),recurring:true,description:'Monthly studio rental',reminders:[1,2]},{id:'power',name:'Electricity',category:'Utilities',amount:12500,due:monthDate(prev,22),recurring:true,description:'Estimated monthly electricity bill',reminders:[2]},{id:'mobile',name:'Mobile & internet',category:'Mobile & internet',amount:6500,due:monthDate(prev,28),recurring:true,description:'Business connectivity',reminders:[1]},{id:'stock',name:'Store supplies',category:'Operations',amount:11000,due:date(30),recurring:false,description:'Packaging and store essentials',reminders:[2]}],loans:[{id:'loan1',name:'Equipment financing',principal:300000,total:360000,prior:90000,monthly:30000,start:monthDate(monthShift(currentMonth,-3),25),end:monthDate(monthShift(currentMonth,8),25),next:date(25),reminders:[1,2]}],entries:[],payments:[]};for(let m of [prev,monthShift(currentMonth,-1)]){b.entries.push({id:uid(),type:'collection',date:m+'-05',amount:64000,note:'Sample monthly collections'});for(let o of occurrences(b,monthEnd(m)).filter(o=>o.due.startsWith(m)))b.payments.push({id:uid(),item:o.id,name:o.name,date:o.due,amount:o.amount,note:'Sample settled expense',source:'Available funds'})}let cutoff=+today.slice(-2);for(let d of [3,7,12,16,19])if(d<=cutoff)b.entries.push({id:uid(),type:'collection',date:date(d),amount:d===19?4500:5000,note:'Daily collection'});if(cutoff>=9)b.entries.push({id:uid(),type:'external',date:date(9),amount:10000,note:'Owner contribution',source:'Owner'});return{active:b.id,businesses:[b]}}
let state;try{state=JSON.parse(localStorage.getItem(key))||seed()}catch{state=seed()}const biz=()=>state.businesses.find(b=>b.id===state.active);function save(){try{localStorage.setItem(key,JSON.stringify(state))}catch{toast('Storage is full or unavailable. Export a backup before closing.')}}function toast(t){let el=document.getElementById('toast');el.textContent=t;el.style.display='block';clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>el.style.display='none',4500)}
function go(p){page=p;search='';filter='All';render()}function closeModal(){document.getElementById('modal').close()}function header(title,subtitle,buttons=''){return`<div class="heading"><div><div class="eyebrow">Your money, in focus</div><h1>${title}</h1><div class="sub">${subtitle}</div></div><div class="actions">${buttons}</div></div>`}const monthInput=()=>`<input type="month" aria-label="Reporting month" value="${month}" onchange="month=this.value||currentMonth;render()">`;
const addBtn=(label,type)=>`<button class="btn primary" data-write onclick="openForm('${type}')">＋ ${label}</button>`;
function cutoff(){return month<currentMonth?monthEnd(month):today}function monthItems(){return occurrences(biz(),monthEnd(month)).filter(o=>o.due.startsWith(month))}function status(o){let p=paid(biz(),o.id,cutoff());return p>=o.amount-.005?['Settled','']:o.due<cutoff()?[p?'Partial · overdue':'Overdue','red']:p?['Partially paid','amber']:[o.due===today?'Due today':'Upcoming','gray']}
function expenseTable(items,limit=999){return items.length?`<div class="tablewrap"><table><thead><tr><th>Expense</th><th>Due date</th><th>Status</th><th class="amount">Outstanding</th><th></th></tr></thead><tbody>${items.slice(0,limit).map(o=>{let s=status(o),left=Math.max(0,o.amount-paid(biz(),o.id,cutoff()));return`<tr><td><strong>${esc(o.name)}</strong><small>${esc(o.category)}</small></td><td>${fmt(o.due)}<small>${o.due.slice(0,4)}</small></td><td><span class="badge ${s[1]}">${s[0]}</span></td><td class="amount"><strong>${money(left)}</strong><small>of ${money(o.amount)}</small></td><td>${left>.005?`<button class="btn small" data-write onclick="openForm('payment','${o.id}')">Settle</button>`:'<span style="color:var(--teal)">✓</span>'}</td></tr>`}).join('')}</tbody></table></div>`:'<div class="empty">No expenses here yet.<br>Add an expense or loan to start planning.</div>'}
function metrics(){let b=biz(),items=monthItems(),total=sum(items.map(o=>o.amount)),settled=sum(items.map(o=>Math.min(o.amount,paid(b,o.id,cutoff())))),entries=b.entries.filter(e=>e.date.startsWith(month)&&e.date<=cutoff()),previous=sum(occurrences(b,monthEnd(monthShift(month,-1))).filter(o=>o.due.startsWith(monthShift(month,-1))).map(o=>o.amount));return{total,settled,collection:sum(entries.filter(e=>e.type==='collection').map(e=>e.amount)),external:sum(entries.filter(e=>e.type==='external').map(e=>e.amount)),previous}}
function stat(label,value,foot,ic){return`<div class="card stat"><div class="between"><label>${label}</label><span class="icon">${icon(ic)}</span></div><div class="value">${money(value)}</div><div class="foot">${foot}</div></div>`}
function chart(){let b=biz(),ms=Array.from({length:6},(_,i)=>monthShift(month,i-5)),data=ms.map(m=>({m,e:sum(occurrences(b,monthEnd(m)).filter(o=>o.due.startsWith(m)).map(o=>o.amount)),c:sum(b.entries.filter(e=>e.type==='collection'&&e.date.startsWith(m)&&e.date<=today).map(e=>e.amount))})),max=Math.max(1,...data.flatMap(x=>[x.e,x.c]));return`<div class="chart" role="img" aria-label="Six month expenses and collections comparison">${data.map(x=>`<div class="barcol" title="${monthLabel(x.m)}: Expenses ${money(x.e)}, collections ${money(x.c)}"><div class="bars"><div class="bar" style="height:${x.e/max*100}%"></div><div class="bar alt" style="height:${x.c/max*100}%"></div></div><label>${parse(x.m+'-01').toLocaleDateString('en',{month:'short'})}</label></div>`).join('')}</div><div class="legend"><span><i class="dot" style="background:#d9e9e7"></i>Planned expenses</span><span><i class="dot" style="background:#13887d"></i>Collections</span></div>`}
function categories(){let items=monthItems(),total=sum(items.map(x=>x.amount)),cats=[...new Set(items.map(x=>x.category))],colors=['#168c81','#8fc1ad','#b1c7d5','#d7b77c','#9d9ac1'];return cats.length?cats.map((c,i)=>{let n=sum(items.filter(x=>x.category===c).map(x=>x.amount));return`<div class="category"><i class="dot" style="background:${colors[i%5]}"></i><div style="flex:1"><div class="between"><span>${esc(c)}</span><strong>${money(n)}</strong></div><div class="track"><i style="width:${n/total*100}%;background:${colors[i%5]}"></i></div></div></div>`}).join(''):'<div class="empty">Your expense mix will appear here.</div>'}
function overview(){let b=biz(),p=plan(b,today),m=metrics(),progress=m.total?Math.min(100,m.settled/m.total*100):0;let urgent=p.urgent;return header('Business overview',`${esc(b.name)} · A clearer view of what’s ahead.`,monthInput()+addBtn('Record collection','collection'))+`<section class="hero"><div class="left"><div class="eyebrow">${monthLabel(currentMonth)} · Required daily collection</div><div class="target">${money(Math.ceil(p.daily))} <small>/ business day</small></div><p>${p.days} business days left · ${money(p.need)} still to collect by ${fmt(monthEnd(currentMonth))}</p><div class="actions"><button class="btn dark small" data-write onclick="openForm('external')">＋ Add external funding</button><span style="font-size:10px;color:#a0c5bd">Includes today if it’s a working day</span></div></div><div class="right"><div class="between"><span style="font-size:12px;color:#bcd7cf">Available funds · today</span><span class="badge">Carry-forward enabled</span></div><div style="font-size:29px;font-weight:650;margin:12px 0">${money(p.cash)}</div>${urgent?`<div style="font-size:12px;line-height:1.8;color:#c8ded8">${urgent.days?`Collect <strong style="color:white">${money(Math.ceil(urgent.daily))}/day</strong> by ${fmt(urgent.due)}`:`<strong style="color:#f4d49b">${money(urgent.amount)} needed ${urgent.due<today?'for overdue payments':'now'}</strong>`}<br>Highest-priority deadline · ${urgent.days} business days available</div>`:'<div style="color:#9edbc5;font-size:12px">✓ Upcoming commitments are covered.</div>'}</div></section><div class="between" style="margin:0 0 12px"><span class="eyebrow">${monthLabel(month)} snapshot</span>${month!==currentMonth?'<span class="sub">Daily target above always reflects today</span>':''}</div><section class="stats">${stat('Planned expenses',m.total,m.previous?`${Math.abs(Math.round((m.total/m.previous-1)*100))}% ${m.total>=m.previous?'higher':'lower'} than last month`:'No previous month to compare','Expenses')}${stat('Settled expenses',m.settled,`${Math.round(progress)}% of this month’s commitments`,'Payments')}${stat('Daily collections',m.collection,'Recorded collections this month','Collections')}${stat('External funding',m.external,'Outside the daily collection budget','Loans')}</section><div class="grid"><section class="card"><div class="paneltitle"><h2>Payment calendar</h2><button class="link" onclick="go('Expenses')">View all →</button></div>${expenseTable(monthItems(),5)}</section><section class="card"><div class="paneltitle"><h2>Expense breakdown</h2><span class="badge gray">${monthItems().length} items</span></div>${categories()}<div class="callout">Targets account for available funds, unpaid commitments and your business days. External funding stays separate from collections.</div></section></div><div class="grid"><section class="card"><div class="paneltitle"><h2>The bigger picture</h2><button class="link" onclick="go('Reports')">Monthly report →</button></div>${chart()}</section><section class="card"><div class="paneltitle"><h2>Recent activity</h2><span class="sub">Cash movement</span></div>${activity(4)}</section></div>`}
function activity(limit=999){let b=biz(),rows=[...b.entries.map(x=>({...x,label:x.type==='external'?'External funding':'Daily collection',positive:true})),...b.payments.map(x=>({...x,label:x.name,positive:false}))].filter(x=>x.date.startsWith(month)).sort((a,b)=>b.date.localeCompare(a.date));return rows.length?rows.slice(0,limit).map(x=>`<div class="listrow"><span class="icon" style="color:${x.positive?'var(--teal)':'var(--muted)'}">${icon(x.positive?'Collections':'Payments')}</span><div class="grow"><strong style="font-size:12px">${esc(x.label)}</strong><small>${fmt(x.date)} · ${esc(x.note||x.source||'Recorded payment')}</small></div><strong class="${x.positive?'moneypositive':''}" style="font-size:12px">${x.positive?'+':'−'}${money(x.amount)}</strong></div>`).join(''):'<div class="empty">No activity recorded this month.</div>'}
function expensesPage(){let items=monthItems().filter(o=>(o.name+' '+o.category).toLowerCase().includes(search.toLowerCase())).filter(o=>filter==='All'||(filter==='Outstanding'?paid(biz(),o.id,cutoff())<o.amount:paid(biz(),o.id,cutoff())>=o.amount));return header('Expenses & commitments','One place for every bill, recurring cost and instalment.',monthInput()+addBtn('Add expense','expense'))+`<div class="card"><div class="paneltitle"><div class="actions"><input class="search" aria-label="Search expenses" placeholder="Search expenses…" value="${esc(search)}" onchange="search=this.value;render()"><select aria-label="Expense status" onchange="filter=this.value;render()">${['All','Outstanding','Settled'].map(s=>`<option ${filter===s?'selected':''}>${s}</option>`).join('')}</select></div><span class="sub">${items.length} commitments</span></div>${expenseTable(items)}</div><div class="callout">Recurring expenses generate monthly from their first due date. Dates such as the 31st fall on the last day in shorter months. Loan instalments appear here automatically.</div>`}
function loansPage(){let b=biz();return header('Business loans','See your commitments, repayments and remaining terms.',addBtn('Add loan','loan'))+`<div class="loans">${b.loans.map(l=>{let paidNow=sum(b.payments.filter(p=>p.item.startsWith(l.id+'@')&&p.date<=today).map(p=>p.amount)),left=Math.max(0,l.total-l.prior-paidNow),all=occurrences({...b,expenses:[],loans:[l]},'2099-12-31'),terms=all.filter(o=>paid(b,o.id,today)<o.amount-.005).length,next=all.find(o=>paid(b,o.id,today)<o.amount-.005);return`<article class="card"><div class="between"><h2>${esc(l.name)}</h2><span class="badge ${left?'':'gray'}">${left?'Active':'Settled'}</span></div><div class="sub" style="margin-top:9px">${fmt(l.start)} ${l.start.slice(0,4)} — ${fmt(l.end)} ${l.end.slice(0,4)}</div><div class="loanstats"><div><small>Outstanding balance</small><strong style="font-size:23px">${money(left)}</strong></div><div><small>Monthly instalment</small><strong>${money(l.monthly)}</strong></div><div><small>Original principal</small><strong>${money(l.principal)}</strong></div><div><small>Total repayable</small><strong>${money(l.total)}</strong></div></div><div class="track" style="height:7px;background:#edf2f2;border-radius:5px"><i style="background:var(--teal);width:${Math.min(100,(l.prior+paidNow)/l.total*100)}%"></i></div><div class="between sub" style="margin:12px 0 20px;font-size:11px"><span>${money(l.prior+paidNow)} paid, including prior payments</span><span>${terms} terms left</span></div>${next?`<div class="between"><span class="sub">Next unpaid: ${fmt(next.due)} ${next.due.slice(0,4)}</span><button class="btn small" data-write onclick="openForm('payment','${next.id}')">Settle instalment</button></div>`:'<span class="badge">Fully repaid</span>'}</article>`}).join('')||'<div class="card empty">No loans yet. Add your first business loan.</div>'}</div>`}
function collectionsPage(){let m=metrics();return header('Collections & funding','Daily collections and outside contributions, clearly separated.',monthInput()+addBtn('Record collection','collection')+`<button class="btn" data-write onclick="openForm('external')">＋ External funding</button>`)+`<div class="stats">${stat('Daily collections',m.collection,'This month','Collections')}${stat('External funding',m.external,'This month · outside budget','Loans')}${stat('Available funds',balance(biz(),today),'Today · includes carry-forward','Overview')}${stat('Opening balance',biz().opening,'Starting funds for this business','Payments')}</div><div class="card"><h2>Collection ledger</h2><div class="tablewrap"><table style="margin-top:22px"><thead><tr><th>Date</th><th>Type</th><th>Source / note</th><th class="amount">Amount</th></tr></thead><tbody>${biz().entries.filter(e=>e.date.startsWith(month)).sort((a,b)=>b.date.localeCompare(a.date)).map(e=>`<tr><td>${fmt(e.date)}</td><td><span class="badge ${e.type==='external'?'amber':''}">${e.type==='external'?'External · outside budget':'Daily collection'}</span></td><td>${esc(e.source||'')}<small>${esc(e.note)}</small></td><td class="amount">${money(e.amount)}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">No entries this month.</td></tr>'}</tbody></table></div></div>`}
function paymentsPage(){return header('Payment history','A clear record of every full and partial settlement.',monthInput())+`<div class="card"><div class="tablewrap"><table><thead><tr><th>Payment date</th><th>Expense</th><th>Funding / reference</th><th class="amount">Paid</th></tr></thead><tbody>${biz().payments.filter(p=>p.date.startsWith(month)).sort((a,b)=>b.date.localeCompare(a.date)).map(p=>`<tr><td>${fmt(p.date)}</td><td><strong>${esc(p.name)}</strong><small>Due ${fmt(p.item.split('@')[1])}</small></td><td>${esc(p.source)}<small>${esc(p.note)}</small></td><td class="amount">${money(p.amount)}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">No payments this month. Settle an item from Expenses.</td></tr>'}</tbody></table></div></div>`}
function reportsPage(){let b=biz(),ms=Array.from({length:6},(_,i)=>monthShift(month,i-5));return header('Monthly reports','Compare commitments, collections and funding over time.',monthInput()+`<button class="btn" onclick="exportCSV()">↓ Export CSV</button>`)+`<div class="grid"><div class="card"><h2>Six-month comparison</h2>${chart()}</div><div class="card"><h2>${monthLabel(month)} · expense mix</h2>${categories()}</div></div><div class="card"><div class="tablewrap"><table><thead><tr><th>Month</th><th class="amount">Expenses due</th><th class="amount">Collections</th><th class="amount">External funds</th><th class="amount">Payments made</th><th class="amount">Closing funds</th></tr></thead><tbody>${ms.map(m=>{let cut=m<currentMonth?monthEnd(m):today,entries=b.entries.filter(e=>e.date.startsWith(m)&&e.date<=cut);return`<tr><td>${monthLabel(m)}</td><td class="amount">${money(sum(occurrences(b,monthEnd(m)).filter(o=>o.due.startsWith(m)).map(o=>o.amount)))}</td><td class="amount">${money(sum(entries.filter(e=>e.type==='collection').map(e=>e.amount)))}</td><td class="amount">${money(sum(entries.filter(e=>e.type==='external').map(e=>e.amount)))}</td><td class="amount">${money(sum(b.payments.filter(p=>p.date.startsWith(m)&&p.date<=cut).map(p=>p.amount)))}</td><td class="amount">${m>currentMonth?'—':money(balance(b,cut))}${m===currentMonth?'<small>Month to date</small>':''}</td></tr>`}).join('')}</tbody></table></div></div><div class="callout">Expenses are grouped by due month. Payments are grouped by actual payment date. Opening funds and unused collections carry forward automatically.</div>`}
function alerts(){let horizon=parse(today);horizon.setDate(horizon.getDate()+7);return occurrences(biz(),iso(horizon)).filter(o=>paid(biz(),o.id,today)<o.amount-.005).map(o=>({...o,diff:Math.round((parse(o.due)-parse(today))/86400000)})).filter(o=>o.diff<=0||o.reminders.includes(o.diff))}
function notificationsPage(){let a=alerts();return header('Notifications','Upcoming reminders and overdue commitments.',`<button class="btn" onclick="enableNotifications()">Enable browser alerts</button>`)+`<div class="notice">In-app reminders refresh when you use the app. Browser alerts are a permission-based demo while the app is open. Scheduled push notifications when closed need a backend and service worker.</div><div class="card">${a.map(o=>`<div class="listrow"><span class="badge ${o.diff<0?'red':'amber'}">${o.diff<0?'Overdue':o.diff===0?'Today':o.diff+' days'}</span><div class="grow"><strong>${esc(o.name)}</strong><small>${money(o.amount-paid(biz(),o.id,today))} outstanding · due ${fmt(o.due)}</small></div><button class="btn small" data-write onclick="openForm('payment','${o.id}')">Settle</button></div>`).join('')||'<div class="empty">✓ You’re all caught up.<br>No reminders due today.</div>'}</div>`}
function settingsPage(){let b=biz();return header('Business settings','Your business details, working days and viewer access.',`<button class="btn primary" data-write onclick="openForm('business','edit')">Edit business</button>`)+`<div class="settingsgrid"><section class="card"><div class="between"><h2>${esc(b.name)}</h2><span class="badge">LKR</span></div><p class="sub">${esc(b.description||'Add a description for your business.')}</p><p>${esc(b.email||'No email added')}<br>${esc(b.phone||'No phone added')}<br>${esc(b.address||'No address added')}</p><h3>Business days</h3><div class="actions">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map((d,i)=>`<span class="badge ${b.days.includes(i)?'':'gray'}">${d}</span>`).join('')}</div><div class="callout">Unused funds carry forward. Opening balance: <strong>${money(b.opening)}</strong>. Monthly target deadline: last day of the month.</div></section><section class="card"><div class="paneltitle"><h2>View-only access</h2><button class="btn small" data-write onclick="openForm('viewer')">＋ Add viewer</button></div><div class="notice">Prototype only: viewer emails are stored locally; no invitation is sent and no real account access is granted.</div>${b.members.map(e=>`<div class="listrow"><div class="grow">${esc(e)}<small>View-only · invitation draft</small></div><span class="badge gray">Draft</span></div>`).join('')||'<p class="sub">No viewers added yet.</p>'}<button class="btn" style="margin-top:18px" onclick="viewOnly=!viewOnly;render()">${viewOnly?'Exit viewer preview':'Preview view-only mode'}</button></section><section class="card"><h2>Your prototype data</h2><p class="sub">Saved in this browser on this device. Export a backup to keep a copy. Real sign-in, shared data and automatic push delivery are next-stage features.</p><button class="btn" onclick="backup()">↓ Download data backup</button></section></div>`}
function render(){let b=biz();document.getElementById('nav').innerHTML=Object.keys(icons).map(n=>`<button class="${page===n?'active':''}" onclick="go('${n}')">${icon(n)}${n}</button>`).join('');document.getElementById('businessSelect').innerHTML=state.businesses.map(x=>`<option value="${x.id}" ${x.id===b.id?'selected':''}>${esc(x.name)}</option>`).join('');document.getElementById('logo').innerHTML=b.logo?`<img class="bizlogo" alt="Business logo" src="${b.logo}">`:`<div class="bizlogo">${esc(b.name.slice(0,1))}</div>`;document.getElementById('bell').innerHTML=icon('Notifications')+(alerts().length?`<span>${alerts().length}</span>`:'');let views={Overview:overview,Expenses:expensesPage,Loans:loansPage,Collections:collectionsPage,Payments:paymentsPage,Reports:reportsPage,Notifications:notificationsPage,Settings:settingsPage};document.getElementById('content').innerHTML=(viewOnly?'<div class="notice">View-only preview · Changes are disabled. <button class="link" onclick="viewOnly=false;render()">Exit preview</button></div>':'')+views[page]()+`<div class="footer"><span>FlowLedger · A little clarity, every day.</span><span>Local prototype · ${fmt(today)} ${today.slice(0,4)} · LKR</span></div>`;document.querySelectorAll('#content table').forEach(table=>{if(page!=='Reports')table.classList.add('mobilecards');let labels=Array.from(table.querySelectorAll('thead th')).map(th=>th.textContent);table.querySelectorAll('tbody tr').forEach(row=>Array.from(row.children).forEach((td,i)=>td.dataset.label=labels[i]||''));});document.querySelectorAll('[data-write]').forEach(el=>el.disabled=viewOnly);save()}
document.getElementById('businessSelect').onchange=e=>{state.active=e.target.value;viewOnly=false;render()};
const field=(label,name,type='text',value='',extra='',wide=false)=>`<div class="field ${wide?'wide':''}"><label for="${name}">${label}</label><input id="${name}" name="${name}" type="${type}" value="${esc(value)}" ${extra}></div>`;
const notes=(label='Note / reference')=>`<div class="field wide"><label for="note">${label}</label><textarea name="note" id="note" maxlength="500"></textarea></div>`;
const reminderFields=(selected=[1,2])=>`<div class="field wide"><label>In-app reminder</label><div class="checks">${[1,2,3,7].map(n=>`<label><input type="checkbox" name="reminders" value="${n}" ${selected.includes(n)?'checked':''}>${n} day${n>1?'s':''} before</label>`).join('')}</div><small>Due-today and overdue alerts always appear.</small></div>`;
function openForm(type,arg=''){if(viewOnly)return;let b=biz(),body='',title='',button='Save',o;
if(type==='business'){let x=arg==='edit'?b:{name:'',description:'',email:'',phone:'',address:'',opening:0,days:[1,2,3,4,5,6]};title=arg==='edit'?'Edit business':'Create a business';body=field('Business name','name','text',x.name,'required maxlength="80"',true)+notes('Description')+field('Email','email','email',x.email)+field('Phone','phone','tel',x.phone)+field('Address','address','text',x.address,'maxlength="200"',true)+field('Opening available funds (Rs.)','opening','number',x.opening,'required min="0" step="0.01"')+`<div class="field"><label for="logoFile">Business logo</label><input id="logoFile" name="logoFile" type="file" accept="image/png,image/jpeg,image/webp"><small>PNG, JPEG or WebP · maximum 500 KB</small></div><div class="field wide"><label>Business days</label><div class="checks">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map((d,i)=>`<label><input type="checkbox" name="days" value="${i}" ${x.days.includes(i)?'checked':''}>${d}</label>`).join('')}</div></div>`}
if(type==='expense'){title='Add an expense';body=field('Expense name','name','text','','required maxlength="80"',true)+`<div class="field"><label for="category">Category</label><select name="category" id="category">${['Rent','Utilities','Mobile & internet','Operations','Salaries','Marketing','Other'].map(x=>`<option>${x}</option>`).join('')}</select></div>`+field('Amount (Rs.)','amount','number','','required min="0.01" step="0.01"')+field('First due date','due','date',today,'required')+`<div class="field"><label for="recurring">Frequency</label><select name="recurring" id="recurring"><option value="false">One-time</option><option value="true">Monthly recurring</option></select></div>`+notes('Description')+reminderFields()}
if(type==='loan'){title='Add a business loan';body=field('Loan / lender name','name','text','','required maxlength="80"',true)+field('Original principal (Rs.)','principal','number','','required min="0.01" step="0.01"')+field('Total repayable, with interest (Rs.)','total','number','','required min="0.01" step="0.01"')+field('Already paid before tracking (Rs.)','prior','number',0,'required min="0" step="0.01"')+field('Monthly instalment (Rs.)','monthly','number','','required min="0.01" step="0.01"')+field('Loan start date','start','date',today,'required')+field('Agreed end date','end','date',monthDate(monthShift(currentMonth,11),today.slice(-2)),'required')+field('Next unpaid instalment due','next','date',today,'required',true)+`<div class="field wide"><small>We calculate remaining terms from total repayable minus prior payments. Prior payments do not reduce current available funds. The final instalment may be smaller.</small></div>`+reminderFields()}
if(type==='collection'||type==='external'){title=type==='collection'?'Record daily collection':'Add external funding';body=field('Amount (Rs.)','amount','number','','required min="0.01" step="0.01"')+field('Date','date','date',today,`required max="${today}"`)+(type==='external'?field('Funding source','source','text','','required placeholder="e.g. Owner contribution" maxlength="100"',true):'')+notes();if(type==='external')body+='<div class="field wide"><small>This increases available funds and lowers the collection target. It stays separate from daily collections.</small></div>'}
if(type==='payment'){o=occurrences(b,'2099-12-31').find(o=>o.id===arg);if(!o)return;let left=o.amount-paid(b,o.id,today);title='Settle '+o.name;body=`<div class="field wide"><div class="callout" style="margin:0">Outstanding: <strong>${money(left)}</strong> · Due ${fmt(o.due)}<br>Available funds today: ${money(balance(b,today))}</div></div>`+field('Payment amount (Rs.)','amount','number',left,`required min="0.01" max="${left}" step="0.01"`)+field('Payment date','date','date',today,`required max="${today}"`)+`<div class="field wide"><label for="funding">Pay using</label><select id="funding" name="funding" onchange="document.getElementById('externalSource').hidden=this.value!=='external'"><option value="cash">Available business funds</option><option value="external">New external money · outside budget</option></select></div><div class="field wide" id="externalSource" hidden><label for="source">External source</label><input id="source" name="source" placeholder="e.g. Personal savings" maxlength="100"></div>`+notes();button='Record payment'}
if(type==='viewer'){title='Add a view-only viewer';body='<div class="field wide"><div class="notice">This saves an invitation draft only. No email will be sent from this prototype.</div></div>'+field('Viewer email','email','email','','required',true);button='Save viewer draft'}
let modal=document.getElementById('modal');modal.innerHTML=`<form id="entryForm"><div class="modalhead between"><h2>${esc(title)}</h2><button type="button" class="btn small" onclick="closeModal()" aria-label="Close">✕</button></div><div class="modalbody"><div class="fields">${body}</div><div class="error" id="formError" role="alert"></div></div><div class="modalfoot"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" type="submit">${button}</button></div></form>`;if(type==='business')modal.querySelector('[name=note]').value=arg==='edit'?b.description:'';modal.showModal();document.getElementById('entryForm').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),v=Object.fromEntries(f),num=k=>Number(v[k]),reminders=f.getAll('reminders').map(Number);let err=t=>{document.getElementById('formError').textContent=t};try{
if(type==='business'){let days=f.getAll('days').map(Number);if(!days.length)return err('Select at least one business day.');if(!v.name.trim())return err('Enter a business name.');let x=arg==='edit'?b:{id:uid(),expenses:[],loans:[],entries:[],payments:[],members:[],logo:''};let file=f.get('logoFile'),logo=x.logo;if(file&&file.size){if(file.size>500000||!['image/png','image/jpeg','image/webp'].includes(file.type))return err('Use a PNG, JPEG or WebP image below 500 KB.');logo=await new Promise((res,rej)=>{let r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)})}Object.assign(x,{name:v.name.trim(),description:v.note,email:v.email,phone:v.phone,address:v.address,opening:num('opening'),days,logo});if(arg!=='edit'){state.businesses.push(x);state.active=x.id;page='Overview'}}
if(type==='expense'){if(!v.name.trim())return err('Enter an expense name.');b.expenses.push({id:uid(),name:v.name.trim(),category:v.category,amount:num('amount'),due:v.due,recurring:v.recurring==='true',description:v.note,reminders})}
if(type==='loan'){if(num('prior')>=num('total'))return err('Prior payments must be less than the total repayable.');if(num('total')<num('principal'))return err('Total repayable cannot be less than the original principal.');if(v.end<v.start||v.next<v.start||v.next>v.end)return err('The next unpaid due date must fall between the start and end dates.');let terms=Math.ceil((num('total')-num('prior'))/num('monthly'));if(terms>600)return err('Please keep the loan schedule within 600 monthly instalments.');let last=monthDate(monthShift(v.next.slice(0,7),terms-1),v.next.slice(-2));if(last>v.end)return err('These amounts require '+terms+' remaining instalments, ending '+last+'. Adjust the end date or instalment amount.');b.loans.push({id:uid(),name:v.name.trim(),principal:num('principal'),total:num('total'),prior:num('prior'),monthly:num('monthly'),start:v.start,end:v.end,next:v.next,reminders})}
if(type==='collection'||type==='external'){b.entries.push({id:uid(),type,date:v.date,amount:num('amount'),note:v.note,source:v.source||''})}
if(type==='payment'){let amount=num('amount'),left=o.amount-paid(b,o.id,today);if(amount>left+.001)return err('Payment exceeds the outstanding amount.');if(v.funding==='external'&&!v.source.trim())return err('Enter the external funding source.');if(v.funding==='cash'&&amount>balance(b,v.date)+.001)return err('Not enough available funds on this date. Add a collection or select new external money.');let changes=amount*(v.funding==='external'?0:1),dates=[...b.payments.map(x=>x.date),today].filter(d=>d>=v.date);if(changes&&dates.some(d=>balance(b,d)-changes<-.005))return err('This backdated payment would leave later funds negative. Use external funding or correct the date.');let fundingId=null;if(v.funding==='external'){fundingId=uid();b.entries.push({id:fundingId,type:'external',date:v.date,amount,source:v.source,note:'Direct settlement: '+o.name})}b.payments.push({id:uid(),item:o.id,name:o.name,date:v.date,amount,note:v.note,source:v.funding==='external'?'External: '+v.source:'Available funds',fundingId})}
if(type==='viewer'){let email=v.email.trim().toLowerCase();if(b.members.includes(email))return err('This email is already listed.');b.members.push(email)}save();closeModal();render();toast(type==='viewer'?'Viewer draft saved. No invitation sent.':'Saved. Your overview is up to date.')}catch(ex){err('Could not save this record. Please check the details.')}}}
function download(name,text,type){let url=URL.createObjectURL(new Blob([text],{type})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),5000)}function backup(){download('flowledger-backup-'+today+'.json',JSON.stringify(state,null,2),'application/json');toast('Backup downloaded')}function exportCSV(){let rows=[['Expense','Category','Due date','Amount','Paid','Outstanding'],...monthItems().map(o=>[o.name,o.category,o.due,o.amount,paid(biz(),o.id,cutoff()),Math.max(0,o.amount-paid(biz(),o.id,cutoff()))])];download('flowledger-expenses-'+month+'.csv',rows.map(r=>r.map(x=>'"'+String(x).replace(/^[=+@-]/,"'$&").replace(/"/g,'""')+'"').join(',')).join('\r\n'),'text/csv')}
async function enableNotifications(){if(!('Notification'in window))return toast('Browser notifications are unavailable here. In-app reminders still work.');try{let permission=await Notification.requestPermission();if(permission==='granted'){let a=alerts();new Notification('FlowLedger reminders',{body:a.length?`${a.length} payment reminders need your attention. Open Notifications for details.`:'You’re all caught up. No payments need attention today.'});toast('Browser demo alert sent. Closed-app push is not connected.')}else toast('Notification permission was not granted. In-app reminders remain available.')}catch{toast('This browser blocks notifications. Use the in-app reminders.')}}
render();
</script></body></html>
